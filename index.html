<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Command - GitHub Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 350px; background-color: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; z-index: 1000; }
        #map-container { flex-grow: 1; position: relative; }
        #map { height: 100%; width: 100%; }
        
        .header { padding: 20px; border-bottom: 1px solid #30363d; }
        .branding h1 { font-size: 16px; margin: 0; color: #58a6ff; letter-spacing: 1px; text-transform: uppercase; }
        
        .device-info { padding: 20px; }
        .stat-card { background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 15px; }
        .stat-label { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 18px; color: #3fb950; font-weight: bold; margin-top: 5px; }
        
        .status-pill { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 10px; text-transform: uppercase; display: inline-block; }
        .pill-active { color: #3fb950; background: rgba(63, 185, 80, 0.1); border: 1px solid rgba(63, 185, 80, 0.2); }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <div class="branding">
                <h1>NEXUS COMMAND</h1>
                <div style="font-size: 10px; color: #8b949e; margin-top: 5px;">GITHUB DEPLOYMENT // LIVE DATA</div>
            </div>
        </div>
        <div class="device-info">
            <div class="stat-card">
                <div class="stat-label">Agent ID</div>
                <div class="stat-value" id="agent-id">WAITING...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Uplink Status</div>
                <div id="status-container" style="margin-top:10px;">
                    <span class="status-pill pill-active">SEARCHING</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Battery Level</div>
                <div class="stat-value" id="battery-level">--%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last Ping</div>
                <div id="last-ping" style="font-size: 12px; color: #8b949e; font-family: monospace;">--:--:--</div>
            </div>
        </div>
        <div style="padding: 20px; border-top: 1px solid #30363d; font-size: 11px; color: #8b949e;">
            Commands: Edit <b>commands.json</b> in your repo to control the device.
        </div>
    </div>
    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO'
        }).addTo(map);

        let marker = null;

        function fetchData() {
            // Fetch directly from the raw JSON file in your repo
            fetch('device_status.json?t=' + new Date().getTime())
                .then(r => r.json())
                .then(data => {
                    document.getElementById('agent-id').innerText = data.name || data.device_id;
                    document.getElementById('battery-level').innerText = data.battery + '%';
                    document.getElementById('last-ping').innerText = new Date(data.last_seen).toLocaleTimeString();
                    
                    const lat = parseFloat(data.lat);
                    const lon = parseFloat(data.lon);

                    if (lat != 0) {
                        if (!marker) {
                            marker = L.circleMarker([lat, lon], {
                                radius: 10, fillColor: "#3fb950", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.8
                            }).addTo(map);
                            map.setView([lat, lon], 15);
                        } else {
                            marker.setLatLng([lat, lon]);
                        }
                    }
                })
                .catch(e => console.log("Waiting for data file..."));
        }

        setInterval(fetchData, 5000);
        fetchData();
    </script>
</body>
</html>
